name: Test and release TUI

"on":
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Check and bundle (Arch Linux x86_64)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      XMAKE_ROOT: "y"
      TERM: xterm-256color
      LANG: C.UTF-8
      XDG_CONFIG_HOME: /tmp/hrm-ci-config
    steps:
      - name: Install Arch build and test tools
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git ca-certificates xmake cmake ninja pkgconf \
            clang ruff just python tmux zstd actionlint shellcheck \
            alsa-lib libx11 libxrandr libxinerama libxcursor libxi \
            mesa libglvnd wayland wayland-protocols libxkbcommon

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache xmake packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.xmake/packages
          key: arch-x86_64-xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            arch-x86_64-xmake-

      - name: Check formatting
        run: just fmt-check

      - name: Check workflow and packaging script
        run: |
          actionlint .github/workflows/ci.yml
          shellcheck .github/scripts/package-tui.sh

      - name: Check C++11 core and packed OJ
        run: just test

      - name: Configure release TUI
        run: xmake f -y -m release --tui=y --gui=n

      - name: Check editor, levels, animation, and saved solutions
        run: just test-tui

      - name: Check procedural audio without opening a device
        run: just test-audio

      - name: Check standalone resource bundle
        run: just test-bundle

      - name: Check bundled TUI mouse and keyboard interactions
        run: python tests/tui-drag.py --binary build/bundle/hrm-tui

      - name: Package and smoke-test release files
        run: bash .github/scripts/package-tui.sh

      - name: Upload tested release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hrm-tui-linux-x86_64-arch
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish tagged TUI
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hrm-tui-linux-x86_64-arch
          path: release

      - name: Verify checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            release/hrm-tui-linux-x86_64-arch
            release/hrm-tui-linux-x86_64-arch.tar.gz
            release/SHA256SUMS
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            options=(--verify-tag --generate-notes --title "$RELEASE_TAG")
            if [[ "$RELEASE_TAG" == *-* ]]; then
              options+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" "${options[@]}"
          fi
